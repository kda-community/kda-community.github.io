<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found | Kadena Community Edition</title>
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
    <script>
        (function () {
            var path = window.location.pathname;
            if (path.length > 1 && path.charAt(path.length - 1) === "/" && path.indexOf("/docs/") === 0) {
                window.location.replace(path.replace(/\/+$/, "") + window.location.search + window.location.hash);
            }
        })();
    </script>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #050505;
            color: #f5f5f5;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 32rem;
            text-align: center;
            background: #121212;
            border: 1px solid #27272a;
            border-radius: 1rem;
            padding: 2.5rem 1.75rem;
        }

        .code {
            margin: 0 0 0.5rem;
            font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            color: #63e038;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.5rem;
        }

        p {
            margin: 0 0 1.75rem;
            color: #9ca3af;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        a {
            text-decoration: none;
            font-weight: 700;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
        }

        .primary {
            background: #63e038;
            color: #000;
        }

        .primary:hover {
            background: #4ecf25;
        }

        .secondary {
            border: 1px solid #3f3f46;
            color: #f5f5f5;
        }

        .secondary:hover {
            border-color: #63e038;
        }

        @media (prefers-color-scheme: light) {
            body {
                background: #FAFAFA;
                color: #1e1f23;
            }

            .card {
                background: #ffffff;
                border-color: #e5e7eb;
            }

            p {
                color: #4b5563;
            }

            .secondary {
                border-color: #d1d5db;
                color: #1e1f23;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>The page you are looking for doesn't exist or may have moved.</p>
        <div class="actions">
            <a class="primary" href="/">Go Home</a>
            <a class="secondary" href="/docs/">Browse Docs</a>
        </div>
    </main>
</body>

</html>
