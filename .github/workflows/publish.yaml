name: Publish website

on:
  workflow_dispatch:
  
permissions:
  contents: read
  pages: write
  id-token: write
  
jobs:

  build:
    name: "Build and Push Artifact"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    # Setup
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Checkout Docs repository
      uses: actions/checkout@v7
      with:
        repository: kda-community/kadena-docs-new
        path: docs_tmp

    - name: Checkout Pact repository
      uses: actions/checkout@v7
      with:
        repository: kda-community/pact-5
        # ref has to be removed once the newest doc branch is merged.
        ref: fix_docs_A
        path: docs_tmp/pact_tmp

    - name: Checkout KDA tool repository
      uses: actions/checkout@v7
      with:
        repository: kda-community/kda-tool
        path: docs_tmp/kda_tool_tmp

    - name: Install node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        
    - name: Update kda-tool Docs
      run: |
        cd docs_tmp
        echo "" >> docs/guides/kda-tool.md
        cat kda_tool_tmp/README.md >> docs/guides/kda-tool.md

    - name: Build Pact Docs
      run: |
        cd docs_tmp
        DOCS_DIR="docs/pact-5"
        BUILTINS_DIR="docs/builtins"
        SRC_DIR="pact_tmp"



        # Create the target directory if it doesn't exist
        mkdir -p $DOCS_DIR

        # Copy the builtins directory to the Docusaurus docs/pact-5 folder
        echo "Copying builtins files into $DOCS_DIR..."
        cp -r $SRC_DIR/$BUILTINS_DIR/* $DOCS_DIR/

        # Convert all files and directories to lowercase
        echo "Converting file and directory names to lowercase..."
        find $DOCS_DIR -depth | while read path; do
            lowercase_path=$(echo "$path" | awk '{print tolower($0)}')
            if [ "$path" != "$lowercase_path" ]; then
                mv "$path" "$lowercase_path"
            fi
        done

        # Find all markdown files and change lines that start with ### to ## if not the first line
        echo "Updating markdown files..."
        find $DOCS_DIR -name "*.md" | while read -r file; do
            # change line 1 from ## to #
            tmp=$(mktemp)
            sed '1s/^##/#/' "$file" > "$tmp" && mv "$tmp" "$file"

            # change lines 2 to end from ### to ##
            tmp=$(mktemp)
            sed '2,$s/^###/##/' "$file" > "$tmp" && mv "$tmp" "$file"
        done

    - name: Install JS dependencies
      working-directory: docs_tmp
      run: npm install

    - name : Build Docusaurus
      working-directory: docs_tmp
      run: npm run build

    - name: Install Main website
      run: |
        mkdir -p public
        cp -rf *.html public
        cp -rf img public
        cp -rf pdf public
        cp -f sitemap.xml public/
        cp -f robots.txt public/
        cp -f .nojekyll public/
        cp -f news.json public/
        cp -f llms.txt public/
        
    - name: Refresh news.json
      run: |
        curl -sS -m 30 -A 'Mozilla/5.0' 'https://medium.com/feed/@communitykadena' > /tmp/feed.xml || true
        python3 - <<'PY' || true
        import re, json, html
        try:
            raw = open('/tmp/feed.xml', encoding='utf-8', errors='replace').read()
            items = []
            for chunk in raw.split('<item>')[1:]:
                def g(tag):
                    m = re.search(rf'<{tag}>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</{tag}>', chunk, re.S)
                    return html.unescape(m.group(1)).strip() if m else ''
                title = g('title')
                low = title.lower()
                if not title or 'who we are' in low or 'road map' in low:
                    continue
                body = html.unescape(chunk[:6000])
                img = re.search(r'<img[^>]+src="([^">]+)"', body)
                items.append({
                    'title': title,
                    'link': g('link'),
                    'date': g('pubDate'),
                    'image': img.group(1) if img else 'https://placehold.co/600x400/121212/63e038?text=News',
                })
                if len(items) >= 4:
                    break
            if items:
                json.dump(items, open('public/news.json', 'w', encoding='utf-8'), ensure_ascii=False)
                print('news.json refreshed:', len(items))
        except Exception as e:
            print('news refresh skipped:', e)
        PY

    - name: Install Robots.txt file
      run: | 
        echo "" >> public/robots.txt
        echo "# Algolia-Crawler-Verif: 700675B823DFA8AD" >> public/robots.txt

    - name: Install Doc site
      run: |
        mkdir -p public/docs
        cp -rf docs_tmp/build/* public/docs

    - name: Print content
      run: tree -L 3 public

    - name: Send Artifact
      uses: actions/upload-pages-artifact@v5
      with:
          path: ./public

  deploy:
    name: Deploy Website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
